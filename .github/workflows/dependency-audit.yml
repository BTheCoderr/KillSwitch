name: Audit Production Dependencies

on:
  pull_request:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dependency-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Generate patched dependency files
        run: |
          npm install --save-exact next@16.3.7
          npm install --save-dev --save-exact eslint-config-next@16.3.7
          npm audit fix

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Commit patched dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: patch production dependencies"
          git push origin HEAD:feature/dependency-hardening
