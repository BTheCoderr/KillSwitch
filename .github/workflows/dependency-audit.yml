name: Audit Production Dependencies

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Generate patched dependency files
        run: |
          npm install --save-exact next@16.3.7
          npm install --save-dev --save-exact eslint-config-next@16.3.7
          npm audit fix

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Upload patched dependency files
        uses: actions/upload-artifact@v4
        with:
          name: patched-dependency-files
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
