name: Refresh Dependency Lockfile
# One-shot branch workflow; removed after the lockfile is patched.

on:
  push:
    branches:
      - feature/dependency-hardening

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dependency-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade patched framework and transitive fixes
        run: |
          npm install --save-exact next@16.3.7
          npm install --save-dev --save-exact eslint-config-next@16.3.7
          npm audit fix

      - name: Confirm production audit
        run: npm audit --omit=dev

      - name: Commit lockfile refresh
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: patch production dependencies"
          git push origin HEAD:feature/dependency-hardening
