name: Validate Killswitch

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role
          KILLSWITCH_ADMIN_USER: ci-producer
          KILLSWITCH_ADMIN_PASSWORD: ci-only-not-a-real-secret
        run: npm run build

      - name: Verify production control files
        run: |
          test -s proxy.ts
          test -s app/api/admin/mutate/route.ts
          test -s app/api/apply/route.ts
          test -s lib/embed.ts
          test -s lib/timer.ts
          test -s supabase/security_hardening.sql
          test -s supabase/timer_upgrade.sql
          test -s app/api/health/route.ts
          test -s app/admin/readiness/page.tsx
          test -s app/opengraph-image.tsx
          test -s scripts/seed-season-zero.mjs
          test -s docs/SEASON_ZERO_RUNBOOK.md
